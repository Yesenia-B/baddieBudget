  <!----BUDGET FORM---------->
<h2>Weekly Budget</h2>

<div class="week-selector">
  <label for="week">Select a week:</label>
  <select id="week">
  </select>
</div>

  <button id="open-modal-btn" class="add-btn">Add Transaction
     <i class="fa-solid fa-circle-plus"></i>
  </button>
<div id="transaction-modal" class ="modal">
  <div class="modal-content">

    <span class="close-btn">&times;</span>
<h3> Add Transaction</h3>

  <form id="budget-form">
    <label for="title">Transaction Name </label>
    <input type="text" id="title" required>

    <label for="amount">Amount ($) </label>
    <input type="number" id="amount" step="0.01" required>

    <label for="type">Type</label>
      <select id="type">
      <option value="expense">Expense</option>
    </select>

    <label for="category">Category</label> 
    <select id="category" required>
      <option value=" "> Select Category</option>
      <option value="food">Housing</option>
      <option value="food">Groceries/Takeout/Dining In</option>
      <option value="transport">Transportation</option>
      <option value="entertainment">Entertainment</option>
      <option value="bills">Scheduled Bills</option>
      <option value="misc">Miscellaneous</option>
        <option value="health">Health/Medical/Wellbeing</option>
    </select>

    <label for="date" Date></label>
    <input type="date" id="date" required>

    <button type="submit">Add Transaction</button>

</form>
</div>
</div>


<ul id="list"></ul>



  <!----DISPLAY ---------->
<div class="transaction-table">
  <table>
    <thread>
    <tr>
      <th>Transaction</th>
      <th>Type</th>
      <th>Category</th>
      <th>Amount</th>
      <th>Date</th>
      <th>Action</th>
    </tr>
    </thread>
    <tbody id="transaction-list"></tbody>
  </table>
</div>

<div class="summary">
  <h2>Weekly Summary</h2>
  <p>Income: $<span id="total-income">0</span></p>
  <p>Expenses: $<span id="total-expense">0</span></p>
  <p>Balance: $<span id="balance">0</span></p>
</div>

<script type="module" src="js/auth.js"></script>

 </body>
